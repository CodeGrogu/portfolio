<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" fill="none">
  <defs>
    <linearGradient id="cloud-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140a02" />
      <stop offset="50%" stop-color="#241405" />
      <stop offset="100%" stop-color="#0a0501" />
    </linearGradient>
    <linearGradient id="amber-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="amber-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#cloud-bg)" />

  <!-- Multi-Region Mesh Topology -->
  <g transform="translate(250, 160)" filter="url(#amber-blur)">
    <!-- Primary Cluster -->
    <rect x="220" y="40" width="240" height="150" rx="16" fill="#351a05" stroke="#f59e0b" stroke-width="2" />
    <text x="255" y="85" font-family="monospace" font-size="14" font-weight="bold" fill="#fbbf24">PRIMARY CLUSTER</text>
    <text x="255" y="115" font-family="monospace" font-size="12" fill="#d97706">Write Master: US-East</text>
    <text x="255" y="140" font-family="monospace" font-size="12" fill="#34d399">Pool: PgBouncer [Active]</text>

    <!-- Replica 1 -->
    <rect x="0" y="240" width="200" height="120" rx="14" fill="#241203" stroke="#d97706" stroke-width="1.5" />
    <text x="25" y="280" font-family="monospace" font-size="13" font-weight="bold" fill="#fbbf24">EU-WEST REPLICA</text>
    <text x="25" y="310" font-family="monospace" font-size="11" fill="#94a3b8">Sync: 14ms Lag</text>

    <!-- Replica 2 -->
    <rect x="480" y="240" width="200" height="120" rx="14" fill="#241203" stroke="#d97706" stroke-width="1.5" />
    <text x="505" y="280" font-family="monospace" font-size="13" font-weight="bold" fill="#fbbf24">AP-SOUTH REPLICA</text>
    <text x="505" y="310" font-family="monospace" font-size="11" fill="#94a3b8">Sync: 18ms Lag</text>

    <!-- Replication Links -->
    <path d="M 280 190 L 100 240" stroke="url(#amber-glow)" stroke-width="2" stroke-dasharray="6,4" />
    <path d="M 400 190 L 580 240" stroke="url(#amber-glow)" stroke-width="2" stroke-dasharray="6,4" />
  </g>

  <!-- HUD Telemetry -->
  <g font-family="monospace" font-size="14" fill="#fbbf24" opacity="0.85">
    <text x="80" y="90">ARCHITECTURE: SERVERLESS NEON + REDIS</text>
    <text x="80" y="115">ROUTING: PROXIED READ/WRITE REPLICAS</text>
    <text x="940" y="90">THROUGHPUT: 12,400 OPS/S</text>
    <text x="940" y="115">REPLICATION LAG: 16.2ms</text>
  </g>

  <rect x="24" y="24" width="1152" height="627" rx="16" fill="none" stroke="#f59e0b" stroke-width="1" stroke-opacity="0.2" />
</svg>
