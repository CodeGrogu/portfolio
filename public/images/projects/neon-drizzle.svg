<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" fill="none">
  <defs>
    <linearGradient id="neon-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#021019" />
      <stop offset="50%" stop-color="#061f2d" />
      <stop offset="100%" stop-color="#01080d" />
    </linearGradient>
    <linearGradient id="neon-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="cyan-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="20" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#neon-bg)" />

  <!-- Data Flow Nodes & Transaction Diagram -->
  <g transform="translate(180, 160)">
    <!-- Node 1: Edge Request -->
    <rect x="0" y="80" width="200" height="150" rx="16" fill="#0b2838" stroke="#06b6d4" stroke-width="2" />
    <text x="30" y="125" font-family="monospace" font-size="14" font-weight="bold" fill="#38bdf8">SERVER ACTION</text>
    <text x="30" y="155" font-family="monospace" font-size="12" fill="#94a3b8">Zod Validation</text>
    <text x="30" y="180" font-family="monospace" font-size="12" fill="#94a3b8">Rate Limiter [IP]</text>
    <circle cx="200" cy="155" r="6" fill="#06b6d4" />

    <!-- Connecting Path 1 -->
    <path d="M 200 155 L 340 155" stroke="url(#neon-glow)" stroke-width="3" stroke-dasharray="6,4" />

    <!-- Node 2: Neon Serverless Core (Locked) -->
    <rect x="340" y="40" width="260" height="230" rx="20" fill="#082f44" stroke="#38bdf8" stroke-width="2.5" filter="url(#cyan-glow)" />
    <text x="375" y="85" font-family="monospace" font-size="16" font-weight="bold" fill="#ffffff">NEON POSTGRESQL</text>
    <text x="375" y="115" font-family="monospace" font-size="13" fill="#38bdf8">BEGIN TRANSACTION</text>
    <rect x="370" y="130" width="200" height="40" rx="8" fill="#021d2c" stroke="#10b981" stroke-width="1.5" />
    <text x="385" y="155" font-family="monospace" font-size="12" fill="#34d399">LOCK: FOR UPDATE</text>
    <text x="375" y="200" font-family="monospace" font-size="12" fill="#94a3b8">DRIZZLE ORM ENGINE</text>
    <text x="375" y="230" font-family="monospace" font-size="12" fill="#34d399">COMMIT ISOLATION: 100%</text>

    <!-- Connecting Path 2 -->
    <path d="M 600 155 L 740 155" stroke="url(#neon-glow)" stroke-width="3" stroke-dasharray="6,4" />

    <!-- Node 3: Event & Resend Pipeline -->
    <rect x="740" y="80" width="200" height="150" rx="16" fill="#0b2838" stroke="#10b981" stroke-width="2" />
    <text x="770" y="125" font-family="monospace" font-size="14" font-weight="bold" fill="#34d399">RESEND EMAIL</text>
    <text x="770" y="155" font-family="monospace" font-size="12" fill="#94a3b8">ICS Calendar Event</text>
    <text x="770" y="180" font-family="monospace" font-size="12" fill="#94a3b8">Webhook Delivered</text>
  </g>

  <!-- HUD Telemetry -->
  <g font-family="monospace" font-size="14" fill="#38bdf8" opacity="0.85">
    <text x="80" y="90">TRANSACTION CORE: NEON + DRIZZLE ORM</text>
    <text x="80" y="115">ISOLATION LEVEL: SERIALIZED LOCKS</text>
    <text x="960" y="90">LATENCY: 82ms</text>
    <text x="960" y="115">COLLISIONS: 0.00%</text>
  </g>

  <rect x="24" y="24" width="1152" height="627" rx="16" fill="none" stroke="#06b6d4" stroke-width="1" stroke-opacity="0.2" />
</svg>
