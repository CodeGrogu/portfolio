<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" fill="none">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d0a" />
      <stop offset="50%" stop-color="#0e1713" />
      <stop offset="100%" stop-color="#050806" />
    </linearGradient>
    <linearGradient id="grid-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.0" />
    </linearGradient>
    <linearGradient id="mesh-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bg-grad)" />

  <!-- Perspective Floor Grid -->
  <g opacity="0.25">
    <path d="M 100 675 L 500 350 M 300 675 L 540 350 M 500 675 L 580 350 M 700 675 L 620 350 M 900 675 L 660 350 M 1100 675 L 700 350" stroke="#10b981" stroke-width="1.5" />
    <path d="M 200 600 L 1000 600 M 300 520 L 900 520 M 380 460 L 820 460 M 440 410 L 760 410 M 480 375 L 720 375" stroke="#10b981" stroke-width="1.5" />
  </g>

  <!-- Central 3D Spatial Wireframe Polyhedron -->
  <g transform="translate(600, 290)" filter="url(#glow)">
    <!-- Ambient Glow Sphere -->
    <circle r="160" fill="#10b981" opacity="0.12" />
    <circle r="90" fill="#06b6d4" opacity="0.18" />

    <!-- 3D Icosahedron / Octahedron Wireframe -->
    <polygon points="0,-130 110,-50 110,65 0,145 -110,65 -110,-50" fill="none" stroke="url(#mesh-grad)" stroke-width="3" stroke-linejoin="round" />
    <polygon points="0,-130 0,145 110,65" fill="#10b981" fill-opacity="0.08" stroke="#10b981" stroke-width="1.5" />
    <polygon points="0,-130 0,145 -110,65" fill="#06b6d4" fill-opacity="0.08" stroke="#06b6d4" stroke-width="1.5" />
    <polygon points="0,-130 110,-50 0,20" fill="none" stroke="#10b981" stroke-width="1.5" />
    <polygon points="0,-130 -110,-50 0,20" fill="none" stroke="#06b6d4" stroke-width="1.5" />
    <polygon points="0,145 110,65 0,20" fill="none" stroke="#10b981" stroke-width="1.5" />
    <polygon points="0,145 -110,65 0,20" fill="none" stroke="#06b6d4" stroke-width="1.5" />

    <!-- Vertex Points -->
    <circle cx="0" cy="-130" r="5" fill="#34d399" />
    <circle cx="110" cy="-50" r="5" fill="#38bdf8" />
    <circle cx="110" cy="65" r="5" fill="#34d399" />
    <circle cx="0" cy="145" r="5" fill="#38bdf8" />
    <circle cx="-110" cy="65" r="5" fill="#34d399" />
    <circle cx="-110" cy="-50" r="5" fill="#38bdf8" />
    <circle cx="0" cy="20" r="6" fill="#ffffff" />
  </g>

  <!-- Overlay UI HUD Elements -->
  <g font-family="monospace" font-size="14" fill="#6ee7b7" opacity="0.85">
    <text x="80" y="90">PIPELINE: WEBGPU COMPUTE (WGSL)</text>
    <text x="80" y="115">GEOMETRY: DRACO COMPRESSED (LOD-0)</text>
    <text x="80" y="140">FPS: 60.0 [FRAMETIME: 16.4ms]</text>
    <text x="940" y="90">BUFFERS: INSTANCED</text>
    <text x="940" y="115">DRAWCALLS: 18 / FRAME</text>
    <text x="940" y="140">TELEMETRY: PASS [100%]</text>
  </g>

  <!-- Outer Border Frame -->
  <rect x="24" y="24" width="1152" height="627" rx="16" fill="none" stroke="#10b981" stroke-width="1" stroke-opacity="0.2" />
</svg>
