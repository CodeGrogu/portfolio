<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" fill="none">
  <defs>
    <linearGradient id="audio-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#120524" />
      <stop offset="50%" stop-color="#1d0a3a" />
      <stop offset="100%" stop-color="#080214" />
    </linearGradient>
    <linearGradient id="wave-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="30%" stop-color="#8b5cf6" />
      <stop offset="70%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="bloom-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#audio-bg)" />

  <!-- Particle Radial Frequency Waves -->
  <g transform="translate(600, 337)" filter="url(#bloom-glow)">
    <circle r="220" fill="none" stroke="url(#wave-grad)" stroke-width="1.5" stroke-dasharray="4,8" opacity="0.4" />
    <circle r="170" fill="none" stroke="url(#wave-grad)" stroke-width="2" stroke-dasharray="6,6" opacity="0.6" />
    <circle r="120" fill="none" stroke="#8b5cf6" stroke-width="2.5" opacity="0.8" />
    <circle r="60" fill="#a855f7" opacity="0.25" />

    <!-- FFT Spectrum Bars -->
    <path d="M 0 -60 L 0 -150" stroke="#ec4899" stroke-width="4" stroke-linecap="round" />
    <path d="M 42 -42 L 105 -105" stroke="#d946ef" stroke-width="4" stroke-linecap="round" />
    <path d="M 60 0 L 170 0" stroke="#a855f7" stroke-width="4" stroke-linecap="round" />
    <path d="M 42 42 L 130 130" stroke="#8b5cf6" stroke-width="4" stroke-linecap="round" />
    <path d="M 0 60 L 0 160" stroke="#6366f1" stroke-width="4" stroke-linecap="round" />
    <path d="M -42 42 L -115 115" stroke="#3b82f6" stroke-width="4" stroke-linecap="round" />
    <path d="M -60 0 L -180 0" stroke="#06b6d4" stroke-width="4" stroke-linecap="round" />
    <path d="M -42 -42 L -125 -125" stroke="#10b981" stroke-width="4" stroke-linecap="round" />

    <!-- 50,000 Particle Field Teaser -->
    <circle cx="90" cy="-70" r="3" fill="#ffffff" />
    <circle cx="-110" cy="80" r="3" fill="#ffffff" />
    <circle cx="-140" cy="-60" r="2.5" fill="#38bdf8" />
    <circle cx="130" cy="90" r="2.5" fill="#ec4899" />
    <circle cx="30" cy="140" r="3" fill="#a855f7" />
    <circle cx="-50" cy="-130" r="2" fill="#34d399" />
  </g>

  <!-- HUD Telemetry -->
  <g font-family="monospace" font-size="14" fill="#c084fc" opacity="0.85">
    <text x="80" y="90">ANALYZER: WEB AUDIO API (FFT-2048)</text>
    <text x="80" y="115">PARTICLES: 50,000 INSTANCED</text>
    <text x="940" y="90">BLOOM PASS: DUAL-KAWASE</text>
    <text x="940" y="115">AUDIO LATENCY: 11.2ms</text>
  </g>

  <rect x="24" y="24" width="1152" height="627" rx="16" fill="none" stroke="#8b5cf6" stroke-width="1" stroke-opacity="0.2" />
</svg>
