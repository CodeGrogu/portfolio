name: CI Quality Gate

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Baseline Verification (Bun)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      NODE_ENV: production
      NEXT_PUBLIC_APP_URL: https://codegrogu.com
      DATABASE_URL: postgresql://mock_user:mock_pass@localhost:5432/mock_db?sslmode=require
      RESEND_API_KEY: re_mock_ci_token_for_validation
      RESEND_FROM_EMAIL: CodeGrogu <noreply@codegrogu.com>
      UPSTASH_REDIS_REST_URL: https://mock-redis.upstash.io
      UPSTASH_REDIS_REST_TOKEN: mock_token

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun Runtime
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install

      - name: Verify Prettier Code Formatting
        run: bun run format:check

      - name: Strict TypeScript Compilation Check
        run: bun run typecheck

      - name: ESLint Static Analysis
        run: bun run lint

      - name: Execute Automated Unit Tests
        run: bun test

      - name: Compile Production Build (Next.js 16)
        run: bun run build
